name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14

      - name: Verify toolchain
        run: |
          gcc-14 --version
          make --version
          # The Makefile uses -std=c23, accepted by GCC only since 14.
          test "$(gcc-14 -dumpversion | cut -d. -f1)" -ge 14

      - name: Build
        run: |
          make build CC=gcc-14

      - name: Verify the compiler binary was produced
        run: |
          test -x ./compiler

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler
          path: ./compiler

  test:
    name: test
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.15

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: compiler
          path: .

      #  Workaround for downloading from moodle, just for safety also check the sha256sum
      - name: Download interpreter
        run: |
          wget -q https://cdn.0016.cz/Chblk7ft/ic26int-linux-x86_64
          echo "9ebc3ed9d5d24c72972719020b90597355357b56b6473ea94160c8879aeca097  ic26int-linux-x86_64" | sha256sum -c -

      # Artifacts and downloads lose the executable bit.
      - name: Make binaries executable
        run: |
          chmod +x ./compiler ./ic26int-linux-x86_64

      - name: Run tests
        run: |
          python ./testing/run_simple_tests.py --bin ./compiler --int ./ic26int-linux-x86_64 --verbose
