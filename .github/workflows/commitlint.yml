# Validate every commit message in the pull request.
#
# No package.json or lock file here: commitlint is fetched by npx, pinned by
# the env block, and never written into the checkout.
name: commitlint

on: pull_request

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04

    env:
      COMMITLINT_CLI: "@commitlint/cli@21.2.4"
      COMMITLINT_CONFIG: "@commitlint/config-conventional@21.2.4"

    steps:
      # fetch-depth: 0 so the base..head commit range exists locally.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      # No `cache: npm`: setup-node needs a lock file to build its cache key.
      # Pinned to actions/setup-node v4.4.0.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: lts/*

      - name: Validate PR commits with commitlint
        shell: bash
        run: |
          run_commitlint() {
            npx --yes \
              --package="$COMMITLINT_CLI" \
              --package="$COMMITLINT_CONFIG" \
              commitlint "$@"
          }

          git --version
          node --version
          npm --version
          run_commitlint --version

          run_commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
